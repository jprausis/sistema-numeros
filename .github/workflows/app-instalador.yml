# Gera o APK do app Android do instalador (pasta app-instalador).
# Configure em Settings > Secrets and variables > Actions > Secrets:
#   VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (os mesmos NEXT_PUBLIC_* do sistema web)
#   ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (chave fixa de assinatura do APK)
name: App do Instalador (APK)

on:
  push:
    branches: [main]
    paths:
      - "app-instalador/**"
      - ".github/workflows/app-instalador.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-instalador
    env:
      VITE_API_URL: https://sistema-numeros.vercel.app
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-instalador/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # O runner ubuntu-latest já tem o Android SDK (ANDROID_HOME)

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Cadastre os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          # Remove espaços, quebras de linha e aspas que costumam vir junto ao colar o secret
          LIMPO=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n"'"'")
          echo "ANDROID_KEYSTORE_BASE64: ${#LIMPO} caracteres (esperado: 3256)"
          if ! printf '%s' "$LIMPO" | base64 -d > "$RUNNER_TEMP/instalador-release.keystore"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 inválido: cole de novo o conteúdo inteiro de keystore-base64.txt"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/instalador-release.keystore" >> "$GITHUB_ENV"
          # Confere chave e senha antes do Gradle, com erro legível nas anotações da execução
          if ! SAIDA=$(keytool -list -keystore "$RUNNER_TEMP/instalador-release.keystore" -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" -alias instalador 2>&1); then
            echo "::error::Chave ou senha não conferem (confira ANDROID_KEYSTORE_PASSWORD, ${#KEYSTORE_PASSWORD} caracteres, esperado 24): $(echo "$SAIDA" | head -3 | tr '\n' ' ')"
            exit 1
          fi

      - name: Gerar APK
        working-directory: app-instalador/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon > "$RUNNER_TEMP/gradle.log" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/gradle.log"
          if [ "$STATUS" != "0" ]; then
            echo "::error::$(grep -A8 'What went wrong' "$RUNNER_TEMP/gradle.log" | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/instalador-1.0.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-instalador-apk
          path: app-instalador/android/app/build/outputs/apk/release/instalador-*.apk
