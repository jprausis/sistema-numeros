# Gera o APK do app Android do instalador (pasta app-instalador).
# Configure em Settings > Secrets and variables > Actions > Secrets:
#   VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (os mesmos NEXT_PUBLIC_* do sistema web)
#   ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (chave fixa de assinatura do APK)
name: App do Instalador (APK)

on:
  push:
    branches: [main]
    paths:
      - "app-instalador/**"
      - ".github/workflows/app-instalador.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-instalador
    env:
      VITE_API_URL: https://sistema-numeros.vercel.app
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-instalador/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # O runner ubuntu-latest já tem o Android SDK (ANDROID_HOME)

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Cadastre os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/instalador-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/instalador-release.keystore" >> "$GITHUB_ENV"

      - name: Gerar APK
        working-directory: app-instalador/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/instalador-1.0.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-instalador-apk
          path: app-instalador/android/app/build/outputs/apk/release/instalador-*.apk
